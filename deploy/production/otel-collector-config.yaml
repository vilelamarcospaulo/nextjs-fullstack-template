# OpenTelemetry Collector configuration for the production stack.
# Copied from the root otel-collector-config.yaml — keep in sync if the
# pipeline changes. In production, ports 4317/4318 are NOT published to the
# host; the app reaches the collector by service name (otel-collector) over
# the internal appnet bridge network.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: detailed
  otlp/jaeger:
    # jaeger is the Docker service name — reachable over appnet.
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
