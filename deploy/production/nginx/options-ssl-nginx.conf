# Mozilla "Intermediate" TLS configuration.
# Based on https://ssl-config.mozilla.org/ (Intermediate profile, nginx).
# Last reviewed: 2026-06.
#
# Supports Firefox 27+, Android 4.4.2+, Chrome 31+, Edge 12+, IE 11+,
# Java 8u31+, OpenSSL 1.0.1+, Opera 20+, Safari 9+.
#
# Do NOT add ssl_certificate or ssl_certificate_key here — they belong in
# the server block in app.conf.template so each vhost can use its own cert.

# TLS session cache shared across nginx worker processes.
ssl_session_cache   shared:MozSSL:10m;  # roughly 40,000 sessions
ssl_session_timeout 1d;
ssl_session_tickets off;

# Supported protocol versions — drop TLS 1.0 and 1.1 (deprecated by RFC 8996).
ssl_protocols TLSv1.2 TLSv1.3;

# Cipher list for TLS 1.2 (TLS 1.3 ciphers are not configurable here).
# Taken from Mozilla Intermediate recommendation.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;

# Let the client pick cipher order (modern browsers pick well).
ssl_prefer_server_ciphers off;

# OCSP Stapling — reduces TLS handshake latency by including the cert status.
ssl_stapling        on;
ssl_stapling_verify on;

# Public DNS resolver for OCSP stapling (Google + Cloudflare).
resolver 8.8.8.8 1.1.1.1 valid=300s;
resolver_timeout 5s;
