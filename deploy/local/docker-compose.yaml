# Local development telemetry stack: OpenTelemetry Collector + Jaeger.
#
# This compose stack provides only the telemetry backends (collector, tracing UI)
# and is designed to run alongside the app executing on the host via `npm run dev`.
# The app exports traces/logs to http://localhost:4318 when OTEL_EXPORTER_OTLP_ENDPOINT
# is set; see deploy/README.md for setup instructions.

services:
  # OpenTelemetry Collector: receives OTLP traces/logs from the app
  # and forwards them to Jaeger for visualization.
  otel-collector:
    # Pinned for reproducibility — the collector config schema can change across
    # contrib releases. Bump deliberately, re-checking otel-collector-config.yaml.
    image: otel/opentelemetry-collector-contrib:0.154.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - telemetry

  # Jaeger: distributed tracing backend and UI (http://localhost:16686).
  # Collector forwards OTLP traces here for visualization and analysis.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
    networks:
      - telemetry

networks:
  telemetry:
    driver: bridge
