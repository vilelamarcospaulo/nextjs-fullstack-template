# Local development database.
#
# This compose stack used to also run an OpenTelemetry Collector + Jaeger for
# local tracing, but the app no longer has an OTel/pino stack to feed them
# (see git history: the app migrated to Cloudflare Workers, where pino/OTel
# don't run — replaced by a plain console.log logger and Cloudflare's own
# Workers Logs). Postgres is the only thing left here, still needed for local
# dev regardless of runtime: `npm run dev`'s DATABASE_URL, and the app_test
# database the integration test bootstrap creates/drops on the same server.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432" # published so the app running on the host can reach it
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Persists Postgres data across `docker compose down`/`up` cycles.
  pgdata:
