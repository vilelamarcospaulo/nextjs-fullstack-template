name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # src/lib/env.ts's getEnv() validates BETTER_AUTH_SECRET/BETTER_AUTH_URL/
  # GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET on first call (request-scoped, not at
  # import time) and throws if any is empty, so `next build` (which renders
  # routes) and the integration route tests need all four present. DATABASE_URL
  # isn't in that required set (see src/lib/db.ts's getDb()) but is still set
  # here for the same reason. CI never talks to real Google, and lint/format/
  # build never talk to real Postgres, so dummy non-empty values are
  # sufficient. The integration test project overrides DATABASE_URL via
  # vitest.config.ts.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/app"
  BETTER_AUTH_SECRET: "ci-dummy-secret-not-used-for-anything-real"
  BETTER_AUTH_URL: "http://localhost:3000"
  GOOGLE_CLIENT_ID: "ci-dummy-client-id"
  GOOGLE_CLIENT_SECRET: "ci-dummy-client-secret"

jobs:
  ci:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry maps to a script in package.json.
        task: ["lint", "format:check", "typecheck", "test", "build"]
    # GitHub Actions services apply to the whole job regardless of matrix
    # value, so lint/format/build also get an (unused) postgres container —
    # acceptable, since it's cheap and keeps this workflow simple.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"

      - uses: actions/setup-node@v4
        with:
          # Node >= 23.6 so native TS stripping for `node drizzle/seed.ts`
          # works; using the current major to stay close to local dev.
          node-version: "24"
          # Caches the pnpm store keyed on pnpm-lock.yaml's hash — standard
          # setup-node lockfile-based caching, now that one is committed.
          cache: "pnpm"

      # --frozen-lockfile is reproducible (installs exactly what's in
      # pnpm-lock.yaml, never touches it) and fails fast if the lockfile
      # drifts from package.json.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the OpenNext app Worker artifact (.open-next/worker.js) so the
      # app-worker Vitest project has something real to test. This runs
      # regardless of matrix.task to ensure the artifact exists before
      # `pnpm test` executes. The build is idempotent and fast on subsequent
      # runs.
      - name: Build OpenNext app Worker
        run: pnpm run app:build

      - name: Run ${{ matrix.task }}
        run: pnpm run ${{ matrix.task }}
