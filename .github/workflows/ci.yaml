name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # src/lib/env.ts validates these at import time and throws if any is empty, so
  # `next build` and the integration route tests need all five present. CI never
  # talks to real Google, and lint/format/build never talk to real Postgres, so
  # dummy non-empty values are sufficient. The integration test project
  # overrides DATABASE_URL via vitest.config.ts.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/app"
  BETTER_AUTH_SECRET: "ci-dummy-secret-not-used-for-anything-real"
  BETTER_AUTH_URL: "http://localhost:3000"
  GOOGLE_CLIENT_ID: "ci-dummy-client-id"
  GOOGLE_CLIENT_SECRET: "ci-dummy-client-secret"

jobs:
  ci:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry maps to an npm script in package.json.
        task: ["lint", "format:check", "typecheck", "test", "build"]
    # GitHub Actions services apply to the whole job regardless of matrix
    # value, so lint/format/build also get an (unused) postgres container —
    # acceptable, since it's cheap and keeps this workflow simple.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node >= 23.6 so Prisma's `node prisma/seed.ts` (native TS stripping)
          # works; using the current major to stay close to local dev.
          node-version: "24"
          # Caches ~/.npm keyed on package-lock.json's hash — standard
          # setup-node lockfile-based caching, now that one is committed.
          cache: "npm"

      # npm ci is reproducible (installs exactly what's in package-lock.json,
      # never touches it) and faster than npm install — matches how the
      # Dockerfile's deps stage installs (Dockerfile, `deps` stage).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The Prisma client (src/generated/prisma) is gitignored; every task below
      # imports from it, so generate it before running anything.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ${{ matrix.task }}
        run: npm run ${{ matrix.task }}
