services:
  # Runs schema migrations via 'prisma migrate deploy' and exits.
  # The app service depends on this completing successfully before starting.
  migrate:
    build:
      context: .
      target: migrator
      secrets:
        - npmrc
    env_file: .env.docker
    environment:
      DATABASE_URL: file:/data/app.db
    volumes:
      - appdata:/data
    restart: "no"

  # OpenTelemetry Collector: receives OTLP traces/logs from the app
  # and forwards them to Jaeger for visualization.
  otel-collector:
    # Pinned for reproducibility — the collector config schema can change across
    # contrib releases. Bump deliberately, re-checking otel-collector-config.yaml.
    image: otel/opentelemetry-collector-contrib:0.154.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC receiver
      - "4318:4318"  # OTLP HTTP receiver
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - telemetry

  # Jaeger: distributed tracing backend and UI (http://localhost:16686).
  # Collector forwards OTLP traces here for visualization and analysis.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
    networks:
      - telemetry

  # The Next.js application server. Exports traces + logs to the collector
  # when OTEL_EXPORTER_OTLP_ENDPOINT is set. Requires the shared appdata
  # volume for SQLite and successful migration completion.
  app:
    build:
      context: .
      target: runner
      secrets:
        - npmrc
    env_file: .env.docker
    environment:
      DATABASE_URL: file:/data/app.db
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: content-generator
      OTEL_SERVICE_VERSION: "0.1.0"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes:
      - appdata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    networks:
      - telemetry
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  appdata:

networks:
  telemetry:
    driver: bridge

# Private-registry credential consumed only by the build (npm ci) via a BuildKit
# secret mount in the Dockerfile — it is never copied into an image layer. The
# lockfile resolves packages from Nubank CodeArtifact, whose token expires (~12h),
# so refresh your ~/.npmrc auth before building if `npm ci` returns E401.
secrets:
  npmrc:
    file: ${HOME}/.npmrc
